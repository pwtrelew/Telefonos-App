<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teléfonos App</title>
    
    <!-- Íconos de la aplicación -->
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="apple-touch-icon" href="./icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; overflow-x: hidden; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .table-container { max-height: 60vh; overflow-y: auto; }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e1e1e; }
        ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* Ocultar flecha del select en Modo Excel */
        select.excel-cell::-ms-expand { display: none; }

        /* Colores de fondo para celdas de Norte con alto contraste para texto blanco */
        .cell-bg-yellow { background-color: #785206 !important; color: #ffffff !important; }
        .cell-bg-green { background-color: #13532d !important; color: #ffffff !important; }
        .cell-bg-blue { background-color: #163e6c !important; color: #ffffff !important; }

        /* Resaltado de selección tipo Excel sin tapar el color de fondo */
        .excel-selected {
            box-shadow: inset 0 0 0 2px #f5c66d !important;
            background-image: linear-gradient(rgba(245, 198, 109, 0.18), rgba(245, 198, 109, 0.18)) !important;
        }
    </style>
</head>
<body class="bg-[#1e1e1e] text-[#ffffff] min-h-screen">

    <!-- Navbar -->
    <nav class="bg-[#121212] text-[#ffffff] shadow-md p-4 flex justify-between items-center sticky top-0 z-50 rounded-b-3xl">
        <div class="text-xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-phone text-[#f5c66d]"></i> Teléfonos App
        </div>
        <div class="flex items-center gap-3">
            <button id="install-btn" class="hidden bg-[#f5c66d] text-[#1e1e1e] px-3 py-1.5 rounded-lg font-bold text-xs sm:text-sm hover:bg-[#ffdf91] transition shadow-md">
                <i class="fa-solid fa-download"></i> <span class="hidden sm:inline">Instalar App</span>
            </button>
            <div id="nav-user-info" class="hidden flex items-center gap-4">
                <span id="nav-username" class="font-medium text-[#ffffff] truncate max-w-[120px] sm:max-w-xs"></span>
                <button onclick="logout()" class="text-[#b3b3b3] hover:text-[#ffffff] transition text-sm flex items-center gap-1">
                    <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden sm:inline">Salir</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Banner flotante de Actualización Automática -->
    <div id="update-toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-[120] bg-[#f5c66d] text-[#1e1e1e] px-5 py-3 rounded-2xl shadow-2xl font-extrabold text-xs sm:text-sm flex items-center gap-3 cursor-pointer hover:bg-[#ffdf91] transition" onclick="forceUpdateApp()">
        <i class="fa-solid fa-arrows-rotate fa-spin"></i>
        <span>Hay una mejora lista. ¡Toca aquí para actualizar!</span>
    </div>

    <!-- Modal de Confirmación Personalizado (Sin usar confirm nativo) -->
    <div id="custom-confirm-overlay" class="fixed inset-0 bg-black bg-opacity-75 z-[110] hidden items-center justify-center p-4">
        <div class="bg-[#2a2a2a] border border-[#3a3a3a] rounded-3xl max-w-sm w-full p-6 shadow-2xl text-center fade-in">
            <div class="w-12 h-12 rounded-full bg-red-500/20 text-red-400 flex items-center justify-center mx-auto mb-4 text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 id="confirm-modal-title" class="text-lg font-extrabold text-[#ffffff] mb-2">Confirmar acción</h3>
            <p id="confirm-modal-msg" class="text-xs text-[#b3b3b3] mb-6 leading-relaxed"></p>
            <div class="flex gap-3">
                <button onclick="closeConfirmModal()" class="flex-1 py-2.5 rounded-xl bg-[#3a3a3a] text-[#ffffff] font-bold text-xs hover:bg-[#4a4a4a] transition">Cancelar</button>
                <button id="confirm-modal-yes" class="flex-1 py-2.5 rounded-xl bg-red-500 text-[#ffffff] font-bold text-xs hover:bg-red-600 transition">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Advertencia (Territorio anterior pendiente) -->
    <div id="custom-warning-overlay" class="fixed inset-0 bg-black bg-opacity-75 z-[115] hidden items-center justify-center p-4">
        <div class="bg-[#2a2a2a] border border-[#f5c66d] rounded-3xl max-w-sm w-full p-6 shadow-2xl text-center fade-in">
            <div class="w-12 h-12 rounded-full bg-[#f5c66d]/20 text-[#f5c66d] flex items-center justify-center mx-auto mb-4 text-xl">
                <i class="fa-solid fa-bell"></i>
            </div>
            <h3 class="text-lg font-extrabold text-[#ffffff] mb-2">¡Atención!</h3>
            <p id="warning-modal-msg" class="text-xs sm:text-sm text-[#ffffff] mb-6 leading-relaxed"></p>
            <button onclick="closeWarningModal()" class="w-full py-2.5 rounded-xl bg-[#f5c66d] text-[#1e1e1e] font-extrabold text-xs sm:text-sm hover:bg-[#ffdf91] transition">Entendido</button>
        </div>
    </div>

    <!-- Menú Contextual Clic Derecho (Exclusivo Modo Excel / Norte) -->
    <div id="excel-context-menu" class="hidden fixed z-[150] bg-[#252525] border border-[#4a4a4a] rounded-2xl shadow-[0_10px_30px_rgba(0,0,0,0.8)] py-2 w-52 text-xs text-[#ffffff] select-none">
        <button onclick="excelMenuCopy()" class="w-full text-left px-4 py-2.5 hover:bg-[#353535] flex items-center justify-between transition">
            <span class="flex items-center gap-2.5 font-medium"><i class="fa-regular fa-copy text-[#f5c66d] w-4 text-center"></i> Copiar</span>
            <span class="text-[10px] text-[#b3b3b3]">Ctrl+C</span>
        </button>
        <button onclick="excelMenuCut()" class="w-full text-left px-4 py-2.5 hover:bg-[#353535] flex items-center justify-between transition">
            <span class="flex items-center gap-2.5 font-medium"><i class="fa-solid fa-scissors text-red-400 w-4 text-center"></i> Cortar</span>
            <span class="text-[10px] text-[#b3b3b3]">Ctrl+X</span>
        </button>
        <button onclick="excelMenuPaste()" class="w-full text-left px-4 py-2.5 hover:bg-[#353535] flex items-center justify-between transition">
            <span class="flex items-center gap-2.5 font-medium"><i class="fa-regular fa-clipboard text-[#add8e6] w-4 text-center"></i> Pegar</span>
            <span class="text-[10px] text-[#b3b3b3]">Ctrl+V</span>
        </button>
        <div class="border-t border-[#3a3a3a] my-1.5"></div>
        <div class="px-4 py-1.5">
            <span class="text-[10px] text-[#b3b3b3] uppercase font-bold tracking-wider block mb-2">Color de celdas</span>
            <div class="flex items-center justify-between gap-1.5">
                <button onclick="excelMenuColor('yellow')" class="w-8 h-7 rounded-lg bg-[#785206] border border-[#f5c66d] hover:scale-105 transition flex items-center justify-center text-[10px] font-bold text-white shadow" title="Amarillo">A</button>
                <button onclick="excelMenuColor('green')" class="w-8 h-7 rounded-lg bg-[#13532d] border border-[#cde7ac] hover:scale-105 transition flex items-center justify-center text-[10px] font-bold text-white shadow" title="Verde">A</button>
                <button onclick="excelMenuColor('blue')" class="w-8 h-7 rounded-lg bg-[#163e6c] border border-[#add8e6] hover:scale-105 transition flex items-center justify-center text-[10px] font-bold text-white shadow" title="Azul">A</button>
                <button onclick="excelMenuColor('')" class="w-8 h-7 rounded-lg bg-[#1e1e1e] border border-[#555555] hover:scale-105 transition flex items-center justify-center text-xs text-[#b3b3b3] hover:text-white shadow" title="Quitar color">
                    <i class="fa-solid fa-ban"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Contenedor Principal de la App -->
    <main id="app-container" class="p-4 max-w-7xl mx-auto fade-in">
        <div class="text-center py-10">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-[#f5c66d]"></i>
            <p class="mt-4 text-[#b3b3b3]">Cargando sistema...</p>
        </div>
    </main>

    <!-- BOTTOM SHEET MODAL (Menú deslizable) -->
    <div id="bottom-sheet-overlay" class="fixed inset-0 bg-black bg-opacity-70 z-[100] opacity-0 pointer-events-none transition-opacity duration-300" onclick="closeBottomSheet()"></div>
    <div id="bottom-sheet" class="fixed left-0 right-0 bottom-0 bg-[#1e1e1e] rounded-t-3xl z-[101] translate-y-full transition-transform duration-300 max-h-[85vh] flex flex-col shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
        <div class="p-5 border-b border-[#2a2a2a] flex justify-between items-center sticky top-0 bg-[#1e1e1e] rounded-t-3xl z-10">
            <h3 id="bottom-sheet-title" class="font-extrabold text-[#ffffff] text-lg truncate pr-4">Seleccionar</h3>
            <button onclick="closeBottomSheet()" class="text-[#b3b3b3] hover:text-[#ffffff] bg-[#2a2a2a] rounded-full min-w-[32px] h-8 flex items-center justify-center transition">
                <i class="fa-solid fa-times"></i>
            </button>
        </div>
        <div id="bottom-sheet-content" class="overflow-y-auto pb-6">
            <!-- El contenido se inyecta dinámicamente -->
        </div>
    </div>

    <!-- PWA Setup Dinámico -->
    <script>
        const manifest = {
            name: "Teléfonos App",
            short_name: "Teléfonos App",
            start_url: "./",
            display: "standalone",
            background_color: "#1e1e1e",
            theme_color: "#121212",
            icons: [
                {"src": "./icon.png", "sizes": "192x192", "type": "image/png", "purpose": "any maskable"},
                {"src": "./icon.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable"}
            ]
        };
        const manifestURL = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
        document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${manifestURL}">`);
        
        window.forceUpdateApp = async () => {
            if ('caches' in window) {
                const keys = await caches.keys();
                await Promise.all(keys.map(k => caches.delete(k)));
            }
            window.location.reload(true);
        };

        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.protocol === 'http:')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        if (newWorker) {
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    const toast = document.getElementById('update-toast');
                                    if (toast) toast.classList.remove('hidden');
                                }
                            });
                        }
                    });
                }).catch(() => {});
            });
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('install-btn');
            if(installBtn) {
                installBtn.classList.remove('hidden');
                installBtn.onclick = async () => {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if(outcome === 'accepted') {
                        installBtn.classList.add('hidden');
                    }
                    deferredPrompt = null;
                };
            }
        });

        window.addEventListener('appinstalled', () => {
            const installBtn = document.getElementById('install-btn');
            if(installBtn) installBtn.classList.add('hidden');
            deferredPrompt = null;
        });

        setTimeout(() => {
            const container = document.getElementById('app-container');
            if (container && container.innerHTML.includes('Cargando sistema...')) {
                container.innerHTML = `
                    <div class="text-center py-10 fade-in">
                        <i class="fa-solid fa-triangle-exclamation text-5xl text-red-400 mb-4"></i>
                        <h2 class="text-xl font-bold text-[#ffffff]">Problema de conexión</h2>
                        <p class="mt-2 text-[#b3b3b3] text-sm max-w-sm mx-auto">La base de datos está tardando demasiado en responder. Verifica tu conexión a internet.</p>
                        <button onclick="window.location.reload()" class="mt-6 bg-[#f5c66d] text-[#1e1e1e] font-extrabold py-3 px-8 rounded-xl hover:bg-[#ffdf91] transition">Recargar página</button>
                    </div>
                `;
            }
        }, 12000);
    </script>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let parsedConfig;
        try { parsedConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null; } catch (e) {}
        
        const firebaseConfig = parsedConfig || {
            apiKey: "AIzaSyC0Hzs2DrYYxqVsOgjs2m7GbFZqGRrrZnQ",
            authDomain: "telefonos-app.firebaseapp.com",
            projectId: "telefonos-app",
            storageBucket: "telefonos-app.firebasestorage.app",
            messagingSenderId: "817969882853",
            appId: "1:817969882853:web:ad7a27f25133be85c6160c"
        };
        
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'territorios-app-123';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        let db;
        try {
            db = initializeFirestore(app, {
                localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
            });
        } catch (err) {
            db = getFirestore(app);
        }

        // Sanitizador de texto contra XSS
        const escapeHTML = (str) => {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        };

        // Estado Global
        let firebaseUser = null;
        let loggedInAppUser = null; 
        let allUsers = [];
        let allTerritories = [];
        let currentViewTerritoryId = null;
        let lastOpenedTerritoryId = null;
        let sortActiveFirst = false;

        let isUserAccordionOpen = false;
        let isPublishersAccordionOpen = false;
        let excelSel = { startR: -1, startC: -1, endR: -1, endC: -1, isDragging: false };
        let internalClipboard = "";
        let publisherSearchQuery = '';
        let confirmActionCallback = null;
        let warnedTerritoriesSession = new Set();

        const OpcionesLlamada = [
            "-", 
            "No atendió nadie", 
            "No abonado/inhab.", 
            "Cortó/ No le Interesa", 
            "Se dejó mensaje en el contes.", 
            "Atendió, Ocupado", 
            "Empresa o Comercio", 
            "Revisita", 
            "NO volver a llamar"
        ];

        // Modal de confirmación personalizado
        window.openConfirmModal = (title, message, onConfirm) => {
            document.getElementById('confirm-modal-title').textContent = title;
            document.getElementById('confirm-modal-msg').textContent = message;
            confirmActionCallback = onConfirm;
            const overlay = document.getElementById('custom-confirm-overlay');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
        };

        window.closeConfirmModal = () => {
            const overlay = document.getElementById('custom-confirm-overlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
            confirmActionCallback = null;
        };

        window.openWarningModal = (htmlMessage) => {
            document.getElementById('warning-modal-msg').innerHTML = htmlMessage;
            const overlay = document.getElementById('custom-warning-overlay');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
        };

        window.closeWarningModal = () => {
            const overlay = document.getElementById('custom-warning-overlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
        };

        // Guardado atómico en tiempo real para que múltiples PCs editen al mismo tiempo sin pisarse los datos
        const safeUpdateTerritoryNumbers = async (tId, mutatorFn) => {
            const tRef = doc(db, 'artifacts', appId, 'public', 'data', 'territories', tId);
            const localTerritory = allTerritories.find(t => t.id === tId);

            // Actualización optimista local inmediata para fluidez visual
            if (localTerritory && localTerritory.numbers) {
                const clonedNumbers = JSON.parse(JSON.stringify(localTerritory.numbers));
                mutatorFn(clonedNumbers, localTerritory);
                localTerritory.numbers = clonedNumbers;
            }

            try {
                await runTransaction(db, async (transaction) => {
                    const sfDoc = await transaction.get(tRef);
                    if (!sfDoc.exists()) return;
                    const data = sfDoc.data();
                    const numbers = Array.isArray(data.numbers) ? [...data.numbers] : [];
                    
                    const extraUpdates = mutatorFn(numbers, data) || {};
                    transaction.update(tRef, { numbers, ...extraUpdates });
                });
            } catch (err) {
                // Respaldo automático si una PC pierde internet momentáneamente
                if (localTerritory && localTerritory.numbers) {
                    const extraUpdates = mutatorFn(localTerritory.numbers, localTerritory) || {};
                    try {
                        await updateDoc(tRef, { numbers: localTerritory.numbers, ...extraUpdates });
                    } catch (e2) { console.error("Guardado en caché offline", e2); }
                }
            }
        };

        // Verifica si se está empezando un territorio nuevo cuando hay otro anterior sin terminar
        const checkAndWarnUnfinishedTerritories = (currentTId) => {
            if (!loggedInAppUser || warnedTerritoriesSession.has(currentTId)) return;
            const myTerrs = allTerritories.filter(t => t.assignedTo === loggedInAppUser.id);
            if (myTerrs.length < 2) return;

            const currentTerr = myTerrs.find(t => t.id === currentTId);
            if (!currentTerr) return;

            const isNorte = loggedInAppUser?.username?.toLowerCase() === 'norte';
            const currentProg = getProgress(currentTerr, isNorte);
            
            const hasAssigneeWork = (currentTerr.numbers || []).some(n => n.customAssignee && n.customAssignee.trim() !== '');
            const isCurrentNew = currentProg.madeActions === 0 && !hasAssigneeWork;

            if (!isCurrentNew) return;

            let pendingMissingNumbers = 0;
            let pendingTerrNames = [];
            myTerrs.forEach(t => {
                if (t.id !== currentTId) {
                    const p = getProgress(t, isNorte);
                    if (!p.isComplete) {
                        const missing = p.totalNumbers - p.madeActions;
                        if (missing > 0) {
                            pendingMissingNumbers += missing;
                            pendingTerrNames.push(escapeHTML(t.name));
                        }
                    }
                }
            });

            if (pendingMissingNumbers > 0) {
                warnedTerritoriesSession.add(currentTId);
                const terrLabel = pendingTerrNames.join(', ');
                openWarningModal(`Antes de empezar este territorio, ten en cuenta que todavía quedan <strong class="text-[#f5c66d] font-extrabold">${pendingMissingNumbers}</strong> por hacer del territorio <strong class="text-[#f5c66d] font-extrabold">${terrLabel}</strong>. Muchas gracias!`);
            }
        };

        document.getElementById('confirm-modal-yes').addEventListener('click', () => {
            if (confirmActionCallback) confirmActionCallback();
            closeConfirmModal();
        });

        const getProgress = (territory, isNorteAssignee) => {
            let totalNumbers = 0;
            let r1Count = 0;
            let r2Count = 0;

            (territory.numbers || []).forEach(n => {
                totalNumbers++;
                if (n.result && n.result !== "-") r1Count++;
                if (n.result2 && n.result2 !== "-") r2Count++;
            });

            let currentRound = 1;
            let madeActions = r1Count;
            let requiredActions = totalNumbers;
            let isComplete = false;
            
            if (!isNorteAssignee) {
                if (r1Count === totalNumbers && totalNumbers > 0) {
                    currentRound = 2;
                    madeActions = r2Count;
                }
                isComplete = (r1Count === totalNumbers && r2Count === totalNumbers && totalNumbers > 0);
            } else {
                isComplete = (r1Count === totalNumbers && totalNumbers > 0);
            }
            
            return { totalNumbers, currentRound, r1Count, r2Count, madeActions, requiredActions, isComplete };
        };

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Error Auth:", error);
            }
        };

        const container = document.getElementById('app-container');

        window.renderApp = () => {
            try {
                // Si el usuario en una PC está escribiendo activamente dentro de un campo de texto de Norte,
                // actualizamos los valores de las demás celdas silenciosamente sin destruir su cursor activo.
                const activeEl = document.activeElement;
                const isTypingInExcel = activeEl && activeEl.classList.contains('excel-cell') && activeEl.tagName === 'INPUT' && activeEl.type === 'text' && currentViewTerritoryId && lastOpenedTerritoryId === currentViewTerritoryId;

                if (isTypingInExcel) {
                    const territory = allTerritories.find(t => t.id === currentViewTerritoryId);
                    if (territory && territory.numbers) {
                        territory.numbers.forEach((num, idx) => {
                            const assignInput = document.querySelector(`input.excel-cell[data-row="${idx}"][data-col="1"]`);
                            if (assignInput && assignInput !== activeEl) assignInput.value = num.customAssignee || '';

                            const dateInput = document.querySelector(`input.excel-cell[data-row="${idx}"][data-col="2"]`);
                            if (dateInput && dateInput !== activeEl) dateInput.value = num.date || '';

                            const resSelect = document.querySelector(`select.excel-cell[data-row="${idx}"][data-col="3"]`);
                            if (resSelect && resSelect !== activeEl) resSelect.value = num.result || '-';

                            for (let c = 0; c <= 3; c++) {
                                const td = document.querySelector(`.excel-td[data-row="${idx}"][data-col="${c}"]`);
                                if (td) {
                                    td.classList.remove('cell-bg-yellow', 'cell-bg-green', 'cell-bg-blue');
                                    const colColor = num.cellColors && num.cellColors[`c${c}`] ? num.cellColors[`c${c}`] : (num.rowColor || '');
                                    if (colColor === 'yellow') td.classList.add('cell-bg-yellow');
                                    if (colColor === 'green') td.classList.add('cell-bg-green');
                                    if (colColor === 'blue') td.classList.add('cell-bg-blue');
                                }
                            }
                        });
                        return;
                    }
                }

                const navUserInfo = document.getElementById('nav-user-info');
                const navUsername = document.getElementById('nav-username');

                let numbersScrollPos = null;
                const numbersScrollContainer = document.getElementById('numbers-scroll-container');
                if (numbersScrollContainer) numbersScrollPos = numbersScrollContainer.scrollTop;

                let adminScrollPos = 0;
                const adminScrollContainer = document.getElementById('admin-table-container');
                if (adminScrollContainer) adminScrollPos = adminScrollContainer.scrollTop;

                if (!loggedInAppUser) {

            const formElement = document.getElementById('createUserForm');

                formElement.addEventListener('submit', async (e) => {

                    const u = input.value.trim();

                if (isNaN(d.getTime())) return '-';
                return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
            };

            const completedHistory = [];
            allTerritories.forEach(t => {
                if (Array.isArray(t.history)) {
                    t.history.forEach(h => {
                        if (h.userId === loggedInAppUser.id) {
                            completedHistory.push({
                                id: t.id,
                                name: t.name,
                                assignedDate: h.assignedDate,
                                completedDate: h.completedDate
                            });
                        }
                    });
                }
                if (t.assignedTo === loggedInAppUser.id) {
                    const prog = getProgress(t, isNorte);

                        const alreadyAdded = completedHistory.some(h => h.id === t.id && h.assignedDate === t.assignedDate);

                            completedHistory.push({
                                id: t.id,
                                name: t.name,
                                assignedDate: t.assignedDate,
                                completedDate: t.completedDate || t.assignedDate
                            });
                        }
                    }
                }
            });

            completedHistory.sort((a, b) => {
                const timeA = a.completedDate ? new Date(a.completedDate).getTime() : (a.assignedDate ? new Date(a.assignedDate).getTime() : 0);

                return timeB - timeA;
            });

            let cardsHtml = '';

                cardsHtml = '<p class="text-[#b3b3b3] col-span-full py-4 px-2 text-center bg-[#1e1e1e] rounded-xl">No tienes territorios asignados en este momento.</p>';
            } else {
                cardsHtml = myTerritories.map(t => {
                    const safeTerrName = escapeHTML(t.name);
                    let displayStatus = (t.status === 'Ronda 1' || t.status === 'Ronda 2') ? 'En curso' : t.status;
                    let statusColor = 'bg-[#1e1e1e] border-[#3a3a3a] text-[#ffffff]';
                    let icon = 'fa-map text-[#b3b3b3]';
                    let statusTextColor = 'text-[#b3b3b3]';
                    let progressFillColor = 'bg-[#f5c66d]';

                    const isNorteAssignee = loggedInAppUser?.username?.toLowerCase() === 'norte';
                    const prog = getProgress(t, isNorteAssignee);

                    if (prog.isComplete) { 
                        statusColor = 'bg-[#1e1e1e] border-[#cde7ac] text-[#ffffff]'; 
                        icon = 'fa-check-circle text-[#cde7ac]'; 
                        statusTextColor = 'text-[#cde7ac]';
                        progressFillColor = 'bg-[#cde7ac]';
                        displayStatus = 'Completado';
                    } else if (t.assignedTo) {
                        statusColor = 'bg-[#1e1e1e] border-[#f5c66d] text-[#ffffff]'; 
                        icon = 'fa-phone text-[#f5c66d]'; 
                        statusTextColor = 'text-[#f5c66d]';
                        displayStatus = 'En curso';

        const renderTerritoryView = (tId, isFirstOpen = false, savedScrollPos = null) => {

                theadHtml = `
                <tr class="bg-[#2a2a2a]">

            } else {
                // --- MODO PUBLICADOR NORMAL (Dinámico según la vuelta) ---

                rowsHtml = (territory.numbers || []).map((num, idx) => {
                    const valResult = num[fieldName] || '-';

                    const labelColor1 = valResult === '-' ? 'text-[#b3b3b3]' : 'text-[#ffffff]';

            let displayStatus = (territory.status === 'Ronda 1' || territory.status === 'Ronda 2') ? 'En curso' : territory.status;
            if (prog.isComplete) displayStatus = 'Completado';

            container.innerHTML = `
                <div class="bg-[#121212] rounded-3xl shadow-xl overflow-hidden flex flex-col h-[85vh] border border-[#2a2a2a]" oncontextmenu="${isNorte ? 'return false;' : ''}">

                    ${prog.isComplete ? `

            `;

            const scrollBox = document.getElementById('numbers-scroll-container');
            if (scrollBox) {
                if (isFirstOpen && isNorte) {
                    let lastWorkedIdx = -1;
                    (territory.numbers || []).forEach((n, idx) => {
                        if ((n.result && n.result !== '-') || (n.customAssignee && n.customAssignee.trim() !== '') || (n.date && n.date !== '')) {
                            lastWorkedIdx = idx;

                    });
                    if (lastWorkedIdx > 0) {

            if (isNorte) updateExcelSelectionUI();

        // ---- LÓGICA DE SELECCIÓN MÚLTIPLE Y MENÚ CONTEXTUAL EXCEL (NORTE) ----
        window.hideExcelContextMenu = () => {
            const menu = document.getElementById('excel-context-menu');
            if (menu) menu.classList.add('hidden');
        };

        window.startExcelDrag = (e, r, c) => {
            if (e && e.button === 2) {
                const minR = Math.min(excelSel.startR, excelSel.endR);
                const maxR = Math.max(excelSel.startR, excelSel.endR);
                const minC = Math.min(excelSel.startC, excelSel.endC);
                const maxC = Math.max(excelSel.startC, excelSel.endC);
                const insideSelection = (minR !== -1 && r >= minR && r <= maxR && c >= minC && c <= maxC);
                if (!insideSelection) {
                    excelSel.startR = r;
                    excelSel.startC = c;
                    excelSel.endR = r;
                    excelSel.endC = c;
                    updateExcelSelectionUI();
                }
                return;
            }
            hideExcelContextMenu();
            excelSel.isDragging = true;
            excelSel.startR = r;
            excelSel.startC = c;
            excelSel.endR = r;
            excelSel.endC = c;
            updateExcelSelectionUI();
        };

        window.enterExcelDrag = (e, r, c) => {
            if (excelSel.isDragging) {
                excelSel.endR = r;
                excelSel.endC = c;
                updateExcelSelectionUI();
            }
        };

        window.openExcelContextMenu = (e, r, c) => {
            e.preventDefault();
            e.stopPropagation();

            const minR = Math.min(excelSel.startR, excelSel.endR);
            const maxR = Math.max(excelSel.startR, excelSel.endR);
            const minC = Math.min(excelSel.startC, excelSel.endC);
            const maxC = Math.max(excelSel.startC, excelSel.endC);

            if (minR === -1 || r < minR || r > maxR || c < minC || c > maxC) {
                excelSel.startR = r;
                excelSel.startC = c;
                excelSel.endR = r;
                excelSel.endC = c;
                updateExcelSelectionUI();
            }

            const menu = document.getElementById('excel-context-menu');
            if (!menu) return;
            menu.classList.remove('hidden');

            const menuWidth = 210;
            const menuHeight = 205;
            let posX = e.clientX;
            let posY = e.clientY;

            if (posX + menuWidth > window.innerWidth) posX = window.innerWidth - menuWidth - 10;
            if (posY + menuHeight > window.innerHeight) posY = window.innerHeight - menuHeight - 10;

            menu.style.left = `${Math.max(8, posX)}px`;
            menu.style.top = `${Math.max(8, posY)}px`;
        };

        window.updateExcelSelectionUI = () => {
            const minR = Math.min(excelSel.startR, excelSel.endR);
            const maxR = Math.max(excelSel.startR, excelSel.endR);
            const minC = Math.min(excelSel.startC, excelSel.endC);
            const maxC = Math.max(excelSel.startC, excelSel.endC);

            document.querySelectorAll('.excel-td').forEach(td => {
                const r = parseInt(td.dataset.row);
                const c = parseInt(td.dataset.col);
                if (r >= minR && r <= maxR && c >= minC && c <= maxC) {
                    td.classList.add('excel-selected'); 
                } else {
                    td.classList.remove('excel-selected');
                }
            });
        };

        const getSelectedTSV = () => {
            const minR = Math.min(excelSel.startR, excelSel.endR);
            const maxR = Math.max(excelSel.startR, excelSel.endR);
            const minC = Math.min(excelSel.startC, excelSel.endC);
            const maxC = Math.max(excelSel.startC, excelSel.endC);
            if (minR === -1) return '';

            let tsv = '';
            for (let r = minR; r <= maxR; r++) {
                let rowData = [];
                for (let c = minC; c <= maxC; c++) {
                    const el = document.querySelector(`.excel-cell[data-row="${r}"][data-col="${c}"]`);
                    rowData.push(el ? el.value : '');
                }
                tsv += rowData.join('\t') + (r === maxR ? '' : '\n');
            }
            return tsv;
        };

        const clearSelectedCellsInDB = async () => {
            const minR = Math.min(excelSel.startR, excelSel.endR);
            const maxR = Math.max(excelSel.startR, excelSel.endR);
            const minC = Math.min(excelSel.startC, excelSel.endC);
            const maxC = Math.max(excelSel.startC, excelSel.endC);
            if (minR === -1 || !currentViewTerritoryId) return;

            if (document.activeElement) document.activeElement.blur();

            await safeUpdateTerritoryNumbers(currentViewTerritoryId, (numbers) => {
                for (let r = minR; r <= maxR; r++) {
                    if (r >= numbers.length) break;
                    for (let c = minC; c <= maxC; c++) {
                        if (c === 1) numbers[r].customAssignee = "";
                        else if (c === 2) numbers[r].date = "";
                        else if (c === 3) numbers[r].result = "-";
                    }
                }
            });
        };

        const applyPasteTextToSelection = async (pasteData, startRow, startCol) => {
            if (!pasteData || !currentViewTerritoryId) return;
            checkAndWarnUnfinishedTerritories(currentViewTerritoryId);

            const minR = Math.min(excelSel.startR, excelSel.endR);
            const maxR = Math.max(excelSel.startR, excelSel.endR);
            const minC = Math.min(excelSel.startC, excelSel.endC);
            const maxC = Math.max(excelSel.startC, excelSel.endC);
            const isMultiSelection = (minR !== -1) && ((minR !== maxR) || (minC !== maxC));

            let rows = pasteData.split(/\r?\n/);
            if (rows.length > 1 && rows[rows.length - 1] === "") rows.pop(); 

            const now = new Date();
            const localToday = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            await safeUpdateTerritoryNumbers(currentViewTerritoryId, (numbers) => {
                if (rows.length === 1 && !rows[0].includes('\t') && isMultiSelection) {
                    const singleVal = rows[0].trim();
                    for (let r = minR; r <= maxR; r++) {
                        if (r >= numbers.length) break;
                        for (let c = minC; c <= maxC; c++) {
                            if (c === 1) {
                                numbers[r].customAssignee = singleVal;
                                if (singleVal !== '' && !numbers[r].date) numbers[r].date = localToday;
                            } else if (c === 2) {
                                numbers[r].date = singleVal;
                            } else if (c === 3) {
                                const matchedOpt = OpcionesLlamada.find(o => o.toLowerCase() === singleVal.toLowerCase());
                                numbers[r].result = matchedOpt ? matchedOpt : singleVal;
                            }
                        }
                    }
                } else {
                    const baseR = startRow !== undefined ? startRow : (minR !== -1 ? minR : 0);
                    const baseC = startCol !== undefined ? startCol : (minC !== -1 ? minC : 1);

                    for (let i = 0; i < rows.length; i++) {
                        const cols = rows[i].split('\t');
                        const targetR = baseR + i;
                        if (targetR >= numbers.length) break;

                        for (let j = 0; j < cols.length; j++) {
                            const targetC = baseC + j;
                            const val = cols[j].trim();

                            if (targetC === 1) { 
                                numbers[targetR].customAssignee = val;
                                if (val !== '' && !numbers[targetR].date) numbers[targetR].date = localToday;
                            } else if (targetC === 2) { 
                                numbers[targetR].date = val;
                            } else if (targetC === 3) { 
                                const matchedOpt = OpcionesLlamada.find(o => o.toLowerCase() === val.toLowerCase());
                                numbers[targetR].result = matchedOpt ? matchedOpt : val;
                            }
                        }
                    }
                }
            });
        };

        window.excelMenuCopy = () => {
            hideExcelContextMenu();
            const tsv = getSelectedTSV();
            if (tsv !== '') {
                internalClipboard = tsv;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(tsv).catch(() => {});
                }
                document.querySelectorAll('.excel-selected').forEach(td => {
                    td.classList.add('opacity-50');
                    setTimeout(() => td.classList.remove('opacity-50'), 150);
                });
            }
        };

        window.excelMenuCut = async () => {
            hideExcelContextMenu();
            const tsv = getSelectedTSV();
            if (tsv !== '') {
                internalClipboard = tsv;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(tsv).catch(() => {});
                }
                await clearSelectedCellsInDB();
            }
        };

        window.excelMenuPaste = async () => {
            hideExcelContextMenu();
            const minR = Math.min(excelSel.startR, excelSel.endR);
            const minC = Math.min(excelSel.startC, excelSel.endC);
            if (minR === -1) return;

            let textToPaste = internalClipboard;
            if (navigator.clipboard && navigator.clipboard.readText) {
                try {
                    const clipText = await navigator.clipboard.readText();
                    if (clipText) textToPaste = clipText;
                } catch (err) {}
            }
            if (textToPaste) {
                await applyPasteTextToSelection(textToPaste, minR, minC);
            }
        };

        window.excelMenuColor = async (colorName) => {
            hideExcelContextMenu();
            const minR = Math.min(excelSel.startR, excelSel.endR);
            const maxR = Math.max(excelSel.startR, excelSel.endR);
            const minC = Math.min(excelSel.startC, excelSel.endC);
            const maxC = Math.max(excelSel.startC, excelSel.endC);
            if (minR === -1 || !currentViewTerritoryId) return;

            await safeUpdateTerritoryNumbers(currentViewTerritoryId, (numbers) => {
                for (let r = minR; r <= maxR; r++) {
                    if (r >= numbers.length) break;
                    if (!numbers[r].cellColors) numbers[r].cellColors = {};
                    for (let c = minC; c <= maxC; c++) {
                        if (colorName) {
                            numbers[r].cellColors[`c${c}`] = colorName;
                        } else {
                            delete numbers[r].cellColors[`c${c}`];
                        }
                    }
                }
            });
        };

        document.addEventListener('mousedown', (e) => {
            const menu = document.getElementById('excel-context-menu');
            if (menu && !menu.classList.contains('hidden') && !menu.contains(e.target)) {
                hideExcelContextMenu();
            }
        });

        document.addEventListener('mouseup', () => {
            if (excelSel.isDragging) excelSel.isDragging = false;
        });

        document.addEventListener('keydown', async (e) => {
            const isNorte = loggedInAppUser?.username?.toLowerCase() === 'norte';
            if (!isNorte || !currentViewTerritoryId) return;

            const minR = Math.min(excelSel.startR, excelSel.endR);
            const maxR = Math.max(excelSel.startR, excelSel.endR);
            const minC = Math.min(excelSel.startC, excelSel.endC);
            const maxC = Math.max(excelSel.startC, excelSel.endC);

            if (minR === -1) return;

            // Copiar bloque con Ctrl + C
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
                excelMenuCopy();
            }

            // Cortar bloque con Ctrl + X
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'x') {
                e.preventDefault();
                await excelMenuCut();
            }

            // Borrar bloque de celdas seleccionadas con Delete o Backspace
            if (e.key === 'Delete' || e.key === 'Backspace') {
                const activeEl = document.activeElement;
                const isMultiCell = (minR !== maxR) || (minC !== maxC);
                const isInputTyping = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'SELECT') && !isMultiCell;
                
                if (!isInputTyping) {
                    e.preventDefault();
                    await clearSelectedCellsInDB();
                }
            }
        });

        window.handleExcelPaste = async (e, startRow, startCol) => {
            const pasteData = (e.clipboardData || window.clipboardData).getData('text');
            if (!pasteData) return;

            internalClipboard = pasteData;
            const minR = Math.min(excelSel.startR, excelSel.endR);
            const maxR = Math.max(excelSel.startR, excelSel.endR);
            const minC = Math.min(excelSel.startC, excelSel.endC);
            const maxC = Math.max(excelSel.startC, excelSel.endC);
            const isMultiSelection = (minR !== -1) && ((minR !== maxR) || (minC !== maxC));

            if (pasteData.includes('\t') || pasteData.includes('\n') || isMultiSelection) {
                e.preventDefault();
                await applyPasteTextToSelection(pasteData, startRow, startCol);
            }
        };

        window.handleAssigneeChange = async (tId, numIndex, value) => {
            checkAndWarnUnfinishedTerritories(tId);
            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            await safeUpdateTerritoryNumbers(tId, (numbers) => {
                if (!numbers[numIndex]) return;
                numbers[numIndex].customAssignee = value;
                if (value.trim() !== '' && !numbers[numIndex].date) {
                    numbers[numIndex].date = today;
                    const dateInput = document.getElementById(`date-${tId}-${numIndex}`);
                    if (dateInput) dateInput.value = today;
                }
            });
        };

        // ---- LÓGICA DEL BOTTOM SHEET ----
        window.closeBottomSheet = () => {
            const overlay = document.getElementById('bottom-sheet-overlay');
            const sheet = document.getElementById('bottom-sheet');
            if(overlay) {
                overlay.classList.remove('opacity-100', 'pointer-events-auto');
                overlay.classList.add('opacity-0', 'pointer-events-none');
            }
            if(sheet) {
                sheet.classList.remove('translate-y-0');
                sheet.classList.add('translate-y-full');
            }
        };

        const showBottomSheet = () => {
            const overlay = document.getElementById('bottom-sheet-overlay');
            const sheet = document.getElementById('bottom-sheet');
            if(overlay) {
                overlay.classList.remove('opacity-0', 'pointer-events-none');
                overlay.classList.add('opacity-100', 'pointer-events-auto');
            }
            if(sheet) {
                sheet.classList.remove('translate-y-full');
                sheet.classList.add('translate-y-0');
            }
        };

        window.openAssignSheet = (tId) => {
            const territory = allTerritories.find(t => t.id === tId);
            document.getElementById('bottom-sheet-title').innerText = `Asignar Territorio ${territory.name}`;
            
            let content = `
                <button onclick="closeAndAssign('${tId}', '')" class="w-full text-left p-4 border-b border-[#2a2a2a] text-[#b3b3b3] hover:bg-[#2a2a2a] transition flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-[#3a3a3a] flex items-center justify-center"><i class="fa-solid fa-user-xmark"></i></div>
                    - (Dejar libre)
                </button>`;
            
            allUsers.filter(u => u.role !== 'admin' && u.username).forEach(u => {
                const isSelected = territory.assignedTo === u.id;
                const textColor = isSelected ? 'text-[#f5c66d]' : 'text-[#ffffff]';
                const bgClass = isSelected ? 'bg-[#2a2a2a]' : 'hover:bg-[#2a2a2a]';
                
                content += `
                <button onclick="closeAndAssign('${tId}', '${u.id}')" class="w-full text-left p-4 border-b border-[#2a2a2a] ${bgClass} transition flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-[#3a3a3a] flex items-center justify-center text-[#add8e6]"><i class="fa-solid fa-user"></i></div>
                        <span class="${textColor} font-bold">${escapeHTML(u.username)}</span>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-check text-[#f5c66d] text-lg"></i>' : ''}
                </button>`;
            });
            
            document.getElementById('bottom-sheet-content').innerHTML = content;
            showBottomSheet();
        };

        window.closeAndAssign = (tId, userId) => {
            closeBottomSheet();
            assignTerritory(tId, userId);
        };

        window.openResultSheet = (tId, numIndex, field, titleLabel) => {
            const territory = allTerritories.find(t => t.id === tId);
            const currentVal = territory.numbers[numIndex][field] || '-';
            
            document.getElementById('bottom-sheet-title').innerText = `Seleccionar ${titleLabel}`;
            
            let content = '';
            OpcionesLlamada.forEach(opt => {
                const isSelected = currentVal === opt;
                const isDash = opt === '-';
                const textColor = isSelected ? 'text-[#f5c66d]' : (isDash ? 'text-[#b3b3b3]' : 'text-[#ffffff]');
                const bgClass = isSelected ? 'bg-[#2a2a2a]' : 'hover:bg-[#2a2a2a]';
                
                content += `
                <button onclick="closeAndUpdateResult('${tId}', ${numIndex}, '${field}', '${opt.replace(/'/g, "\\'")}')" class="w-full text-left p-4 border-b border-[#2a2a2a] ${bgClass} transition flex justify-between items-center text-sm md:text-base">
                    <span class="${textColor} ${isSelected ? 'font-bold' : ''}">${escapeHTML(opt)}</span>
                    ${isSelected ? '<i class="fa-solid fa-check text-[#f5c66d] text-lg"></i>' : ''}
                </button>`;
            });
            
            document.getElementById('bottom-sheet-content').innerHTML = content;
            showBottomSheet();
        };

        window.closeAndUpdateResult = (tId, numIndex, field, newResult) => {
            closeBottomSheet();
            updateResult(tId, numIndex, field, newResult);
        };

        // ---- ACCIONES SECUNDARIAS ----
        window.toggleSortActive = () => { sortActiveFirst = !sortActiveFirst; renderApp(); };

        window.filterPublishers = (query) => {
            publisherSearchQuery = query;
            const lowerQuery = query.toLowerCase();
            document.querySelectorAll('.publisher-card').forEach(card => {
                const name = card.getAttribute('data-name') || '';
                card.style.display = name.includes(lowerQuery) ? '' : 'none';
            });
        };

        window.toggleUserAccordion = () => {
            isUserAccordionOpen = !isUserAccordionOpen;
            const content = document.getElementById('user-form-container');
            const chevron = document.getElementById('user-chevron');
            if (isUserAccordionOpen) {
                content.classList.remove('hidden');
                chevron.classList.replace('fa-chevron-down', 'fa-chevron-up');
            } else {
                content.classList.add('hidden');
                chevron.classList.replace('fa-chevron-up', 'fa-chevron-down');
            }
        };

        window.togglePublishersAccordion = () => {
            isPublishersAccordionOpen = !isPublishersAccordionOpen;
            const content = document.getElementById('publishers-container');
            const chevron = document.getElementById('publishers-chevron');
            if (isPublishersAccordionOpen) {
                content.classList.remove('hidden');
                chevron.classList.replace('fa-chevron-down', 'fa-chevron-up');
            } else {
                content.classList.add('hidden');
                chevron.classList.replace('fa-chevron-up', 'fa-chevron-down');
            }
        };

        window.copyPhone = (phone, btnElement) => {
            const el = document.createElement('textarea');
            el.value = phone;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            
            if (btnElement) {
                const icon = btnElement.querySelector('i');
                icon.className = 'fa-solid fa-check text-[#cde7ac]';
                setTimeout(() => { icon.className = 'fa-regular fa-copy'; }, 1500);
            }
        };

        window.logout = () => { 
            loggedInAppUser = null; 
            currentViewTerritoryId = null; 
            lastOpenedTerritoryId = null;
            warnedTerritoriesSession.clear();
            try { localStorage.removeItem('savedSessionId'); } catch(e){}
            renderApp(); 
        };
        window.openTerritory = (id) => { 
            currentViewTerritoryId = id; 
            renderApp(); 
            checkAndWarnUnfinishedTerritories(id);
        };
        window.closeTerritory = () => { currentViewTerritoryId = null; lastOpenedTerritoryId = null; renderApp(); };

        window.unassignTerritory = (tId, tName) => {
            openConfirmModal(
                `Quitar Territorio ${tName}`,
                `¿Seguro que deseas quitarle el Territorio ${tName} al publicador asignado? Volverá a estar libre y sus números se reiniciarán para el próximo uso (si ya estaba completado, quedará guardado en su historial).`,
                () => assignTerritory(tId, "")
            );
        };

        window.cleanNorteNames = (tId, tName) => {
            openConfirmModal(
                `Limpiar nombres en Terr. ${tName}`,
                `¿Deseas borrar todos los nombres precargados y colores en la columna "Asignado a" del Territorio ${tName}? Los resultados de llamadas y fechas no se borrarán.`,
                async () => {
                    const territory = allTerritories.find(t => t.id === tId);
                    if (!territory || !territory.numbers) return;
                    const cleanedNumbers = territory.numbers.map(n => ({ ...n, customAssignee: "", cellColors: {} }));
                    try {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'territories', tId), { numbers: cleanedNumbers });
                    } catch (err) { console.error(err); }
                }
            );
        };

        window.assignTerritory = async (tId, userId) => {
            try {
                const tRef = doc(db, 'artifacts', appId, 'public', 'data', 'territories', tId);
                const territory = allTerritories.find(t => t.id === tId);
                let newStatus = territory.status;
                let updateData = { assignedTo: userId || null };

                const prevAssignee = allUsers.find(u => u.id === territory.assignedTo);
                const wasNorte = prevAssignee && prevAssignee?.username?.toLowerCase() === 'norte';
                const prevProg = getProgress(territory, wasNorte);
                
                // Si el territorio estaba completado y se libera o se pasa a otro, guardamos el registro en el historial del usuario
                if (territory.assignedTo && territory.assignedTo !== userId && (territory.status === 'Completado' || prevProg.isComplete)) {
                    let history = Array.isArray(territory.history) ? [...territory.history] : [];
                    const alreadyInHist = history.some(h => h.userId === territory.assignedTo && h.assignedDate === territory.assignedDate);
                    if (!alreadyInHist) {
                        history.push({
                            userId: territory.assignedTo,
                            username: prevAssignee ? prevAssignee.username : '',
                            assignedDate: territory.assignedDate || territory.completedDate || new Date().toISOString(),
                            completedDate: territory.completedDate || new Date().toISOString()
                        });
                        updateData.history = history;
                    }
                }
                
                if (userId && newStatus === 'Pendiente') newStatus = 'En curso';
                
                if (!userId) { 
                    newStatus = 'Pendiente'; 
                    updateData.assignedDate = null; 
                    updateData.completedDate = null; 
                    updateData.numbers = (territory.numbers || []).map(n => ({
                        ...n,
                        customAssignee: "",
                        cellColors: {},
                        result: "-",
                        result2: "-",
                        checked1: false,
                        checked2: false,
                        date: "",
                        date2: ""
                    }));
                }
                
                if (userId && territory.assignedTo !== userId) { 
                    updateData.assignedDate = new Date().toISOString(); 
                    updateData.completedDate = null; 
                    
                    // Si es un territorio nuevo (Pendiente), nos aseguramos que entre totalmente limpio sin nombres viejos precargados
                    if (territory.status === 'Pendiente') {
                        updateData.numbers = (territory.numbers || []).map(n => ({
                            ...n,
                            customAssignee: "",
                            cellColors: {},
                            result: "-",
                            result2: "-",
                            checked1: false,
                            checked2: false,
                            date: "",
                            date2: ""
                        }));
                    }
                }

                updateData.status = newStatus;
                await updateDoc(tRef, updateData);
            } catch (err) { console.error("Asignación guardada en caché offline", err); }
        };

        window.updateResult = async (tId, numIndex, field, newResult) => {
            if (newResult !== "-") checkAndWarnUnfinishedTerritories(tId);

            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            await safeUpdateTerritoryNumbers(tId, (numbers, docData) => {
                if (!numbers[numIndex]) return {};
                numbers[numIndex][field] = newResult;

                if (newResult !== "-") {
                    if (field === 'result') numbers[numIndex].date = today;
                    if (field === 'result2') numbers[numIndex].date2 = today;
                } else {
                    if (field === 'result') numbers[numIndex].date = "";
                    if (field === 'result2') numbers[numIndex].date2 = "";
                }

                const assignedUser = allUsers.find(u => u.id === docData.assignedTo);
                const isNorteAssignee = assignedUser && assignedUser?.username?.toLowerCase() === 'norte';

                const prog = getProgress({ numbers }, isNorteAssignee);

                let newStatus = docData.assignedTo ? 'En curso' : 'Pendiente';
                let completedDate = docData.completedDate || null;
                let history = Array.isArray(docData.history) ? [...docData.history] : [];

                if (prog.isComplete) {
                    newStatus = 'Completado';
                    if (docData.status !== 'Completado' || !completedDate) {
                        completedDate = new Date().toISOString();
                    }
                    if (docData.assignedTo) {
                        const existingIdx = history.findIndex(h => h.userId === docData.assignedTo && h.assignedDate === docData.assignedDate);
                        if (existingIdx === -1) {
                            history.push({
                                userId: docData.assignedTo,
                                username: assignedUser ? assignedUser.username : '',
                                assignedDate: docData.assignedDate || completedDate,
                                completedDate: completedDate
                            });
                        } else {
                            history[existingIdx].completedDate = completedDate;
                        }
                    }
                } else {
                    if (docData.status === 'Completado') completedDate = null;
                }

                return { status: newStatus, completedDate, history };
            });
        };

        window.updateNumberField = async (tId, numIndex, field, value) => {
            await safeUpdateTerritoryNumbers(tId, (numbers) => {
                if (numbers[numIndex]) numbers[numIndex][field] = value;
            });
        };

        // ---- INICIALIZACIÓN Y SUSCRIPCIONES A FIREBASE ----
        const initDataListeners = () => {
            const usersRef = collection(db, 'artifacts', appId, 'public', 'data', 'users');
            onSnapshot(usersRef, (snapshot) => {
                const users = [];
                snapshot.forEach(doc => users.push({ id: doc.id, ...doc.data() }));
                
                if (users.length === 0) { 
                    addDoc(usersRef, { username: 'admin', password: 'admin', role: 'admin' }); 
                } else if (!users.find(u => u?.username?.toLowerCase() === 'norte')) {
                    addDoc(usersRef, { username: 'Norte', password: 'norte', role: 'user' });
                }
                
                allUsers = users;
                
                if (!loggedInAppUser) {
                    try { 
                        const savedId = localStorage.getItem('savedSessionId'); 
                        if (savedId) {
                            const found = allUsers.find(u => u.id === savedId);
                            if (found) loggedInAppUser = found;
                        }
                    } catch(e) {}
                } else {
                    const updatedMe = allUsers.find(u => u.id === loggedInAppUser.id);
                    loggedInAppUser = updatedMe || null;
                }
                
                renderApp();
            }, (error) => console.error("Error cargando usuarios:", error));

            const terrRef = collection(db, 'artifacts', appId, 'public', 'data', 'territories');
            onSnapshot(terrRef, (snapshot) => {
                const terrs = [];
                snapshot.forEach(doc => terrs.push({ id: doc.id, ...doc.data() }));
                allTerritories = terrs;
                
                renderApp();
            }, (error) => console.error("Error cargando territorios:", error));
        };

        onAuthStateChanged(auth, (user) => {
            firebaseUser = user;
            if (user) { 
                if (!window.dataListenersInitialized) {
                    window.dataListenersInitialized = true;
                    initDataListeners(); 
                }
                renderApp();
            }
        });

        initAuth();

    </script>
</body>
</html>
